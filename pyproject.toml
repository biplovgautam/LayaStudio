[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layastudio"
version = "0.1.0"
description = "Fine-tune System One decision models on your own data, on your own machine"
keywords = ["laya", "julia", "decider", "mlx", "fine-tuning", "lora", "apple-silicon", "typed-decisions", "local-ai", "noulxp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "laya-mlx>=0.2,<0.3",
  "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=1.26",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.21,<1",
  "pyarrow>=18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]
# Training on NVIDIA, AMD, Intel or the CPU. `systemone run studio` installs the PyTorch build
# the machine needs (CUDA, ROCm, XPU or CPU) before this extra, so it only adds the rest.
# Julia 1's encoder (mmBERT) and Decider's Qwen3.5 need transformers 5.
torch = ["laya>=0.3.5", "torch>=2.4", "transformers>=5.2", "safetensors>=0.4"]
# Decoder families (Decider): LoRA through PEFT on PyTorch, MLX-LM on Apple silicon. On NVIDIA,
# flash-linear-attention makes Qwen3.5's linear attention several times faster, and
# bitsandbytes enables 4-bit QLoRA: pip install flash-linear-attention bitsandbytes
decoder = [
  "torch>=2.4",
  "transformers>=5.2",
  "safetensors>=0.4",
  "peft>=0.17",
  "mlx-lm>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# GGUF exports of decoder fine-tunes and their NoulXP packages: llama.cpp's converter at the
# commit llama-cpp-python 0.3.35 vendors (fetched on first use, layastudio/gguf.py) with the
# requirements of its gguf-py, and llama-cpp-python to run and check the files.
gguf = [
  "llama-cpp-python==0.3.35",
  "numpy>=1.26",
  "sentencepiece>=0.2",
  "protobuf>=4.21",
  "pyyaml>=6",
  "tqdm>=4.27",
  "requests>=2.25",
]
# ONNX and Core ML exports, and NoulXP packages. noulxp 0.4.x is the release systemonemodels.tech
# checks packages with; its extras bring `noulxp export laya` (torch, transformers 5.2+, onnx,
# onnxscript), the `laya` package that records the conformance file, and onnxruntime for the check.
export = [
  "laya>=0.1.6",
  "torch>=2.4",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.2",
  "safetensors>=0.4",
  "noulxp[export,laya,onnx]>=0.4,<0.5",
]
coreml = ["laya>=0.1.6", "torch>=2.4", "coremltools>=8.0", "scikit-learn>=1.4"]
shots = ["Pillow>=11"]
systemone = ["systemonemodels>=0.2.4"]

[project.scripts]
layastudio = "layastudio.server:main"

[project.urls]
Repository = "https://github.com/biplovgautam/LayaStudio"
Issues = "https://github.com/biplovgautam/LayaStudio/issues"
"Laya (upstream model)" = "https://github.com/NandhaKishorM/laya"
"laya-mlx (runtime)" = "https://pypi.org/project/laya-mlx/"

[tool.hatch.build.targets.wheel]
packages = ["layastudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# llama-cpp-python publishes prebuilt CPU wheels (macOS, Linux, Windows) on its own index, not
# on PyPI, where only the source is: take them, so no machine needs a C compiler. With pip:
#   pip install "layastudio[gguf]" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
